[project]
name = "guardrail-studio-api"
version = "0.1.0"
description = "Guardrail Studio backend: pipeline graph -> Kong/Konnect config compiler"
requires-python = ">=3.11"
dependencies = ["guardrail-common", "fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrail_studio"]
