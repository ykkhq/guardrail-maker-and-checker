[project]
name = "guardrail-engine"
version = "0.1.0"
description = "Guardrail detector engine called by Kong DataKit"
requires-python = ">=3.11"
dependencies = ["guardrail-common", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
# Heavy model dependencies. Installed in the Docker image; optional locally.
models = [
  "ollama>=0.3.0",
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
  "transformers>=4.40.0",
  "torch>=2.2.0",
  "spacy>=3.7.0",
  "fugashi>=1.3.0",
  "unidic-lite>=1.0.8",
]
laya = ["laya==0.3.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrail_engine"]

[tool.pytest.ini_options]
markers = ["models: requires heavy ML models (Ollama, spaCy, transformers)"]
