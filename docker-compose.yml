# Start with scripts/up.sh.
# Konnect mode (default): bootstrap first, then up.sh (starts kong-dp profile).
# Gateway mode: GUARDRAIL_DEPLOY_TARGET=gateway (uses kong-enterprise/docker; no local kong-dp).
name: guardrail-studio

services:
  kong-dp:
    profiles: ["konnect-dp"]
    image: kong/kong-ai-gateway:2.1
    env_file: kong/konnect.env          # AI Gateway cluster + telemetry endpoints (from bootstrap)
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_CLUSTER_MTLS: pki
      # PEM contents from scripts/up.sh (the key file stays 0600 on the host).
      KONG_CLUSTER_CERT:
      KONG_CLUSTER_CERT_KEY:
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_CLUSTER_DP_LABELS: "created-by:guardrail-studio"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_NGINX_WORKER_PROCESSES: "2"
      # Resolved by {vault://env/OPENAI_AUTH_HEADER} in the pipeline's model provider.
      OPENAI_AUTH_HEADER:
    ports:
      - "18000:8000"   # proxy: POST http://localhost:18000/pipelines/<slug>/chat/completions
      - "18100:8100"   # status: /status/ready
    depends_on:
      guardrail-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      retries: 10

  guardrail-engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      GUARDRAIL_PRELOAD: presidio_pii,sentiment_kasuhara,llamaguard_safety,laya_classify
      PRESIDIO_LANGUAGES: ja,en
      # Llama Guard: ollama (default) or openai_completions (LM Studio).
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LLAMAGUARD_BACKEND: ${LLAMAGUARD_BACKEND:-ollama}
      LLAMAGUARD_BASE_URL: ${LLAMAGUARD_BASE_URL:-http://host.docker.internal:1234}
      LLAMAGUARD_MODEL: ${LLAMAGUARD_MODEL:-llama-guard3:1b}
      LLAMAGUARD_API_KEY: ${LLAMAGUARD_API_KEY:-}
    volumes:
      - models:/models   # Hugging Face cache survives rebuilds
    ports:
      - "18080:8080"     # direct access for debugging / dry runs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      start_period: 300s   # first start downloads the sentiment model
      retries: 30

  studio-api:
    build:
      context: .
      dockerfile: studio-api/Dockerfile
    environment:
      GUARDRAIL_DEPLOY_TARGET: ${GUARDRAIL_DEPLOY_TARGET:-konnect}
      KONNECT_PAT:                     # from scripts/up.sh (~/.kong/kpat); unused in gateway mode
      KONNECT_REGION: ${KONNECT_REGION:-us}
      KONNECT_CONTROL_PLANE: ${KONNECT_CONTROL_PLANE:-guardrail-service}
      KONG_ADMIN_URL: ${KONG_ADMIN_URL:-http://host.docker.internal:8001}
      KONG_ADMIN_TOKEN: ${KONG_ADMIN_TOKEN:-kongadmin}
      KONG_WORKSPACE: ${KONG_WORKSPACE:-guardrail}
      KONG_SERVICE_URL: ${KONG_SERVICE_URL:-http://mockbin:8080}
      # Empty → studio-api Settings picks defaults from GUARDRAIL_DEPLOY_TARGET.
      GUARDRAIL_ENGINE_URL: ${GUARDRAIL_ENGINE_URL:-}
      ENGINE_URL: ${ENGINE_URL:-http://guardrail-engine:8080}
      KONG_PROXY_URL: ${KONG_PROXY_URL:-}
      KONG_PUBLIC_URL: ${KONG_PUBLIC_URL:-}
      # Chat LLM auth for gateway deploy (Bearer …). From scripts/up.sh / ~/.lmstudio/creds.
      LM_STUDIO_AUTH_HEADER: ${LM_STUDIO_AUTH_HEADER:-}
      STUDIO_CORS_ORIGINS: http://localhost:13000,http://localhost:5173
    volumes:
      - studio-data:/data
    ports:
      - "18200:8000"
    depends_on:
      guardrail-engine:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "13000:80"     # Guardrail Studio UI
    depends_on:
      - studio-api

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

volumes:
  models:
  ollama:
  studio-data:
